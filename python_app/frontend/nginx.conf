server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Using a variable in proxy_pass below means nginx
    # resolves "backend" at request time instead of at startup, so the
    # container still starts cleanly when the API is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Gzip the text assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Fingerprinted build assets can be cached forever.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API traffic is forwarded to the Flask backend. The service name
    # "backend" resolves on the Compose network; the backend listens on 5000
    # inside its own container (the host publishes it on 5001).
    location /api/ {
        set $backend_upstream backend:5000;

        # The Flask routes live at /tasks, not /api/tasks, so strip the prefix.
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Do not cache API responses.
        proxy_cache off;
    }

    # Any other path is a client-side route: hand it to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
